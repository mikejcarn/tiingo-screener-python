<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replay Browser — daily / ind_conf_0</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #ccc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; overflow: hidden; }
  #nav {
    height: 44px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: #000; border-bottom: 1px solid #222;
  }
  button {
    background: #111; color: #ccc; border: 1px solid #333;
    padding: 5px 12px; cursor: pointer; border-radius: 3px; font-size: 13px;
  }
  button:hover { background: #222; }
  #ticker-label { color: #fff; font-weight: bold; font-size: 14px; min-width: 80px; }
  #count { color: #555; font-size: 12px; }
  .sep { width: 1px; height: 24px; background: #222; flex-shrink: 0; }
  #search {
    background: #111; color: #ccc; border: 1px solid #333;
    padding: 4px 8px; border-radius: 3px; font-size: 12px; width: 150px;
  }
  #search:focus { outline: none; border-color: #555; }
  #hint { font-size: 11px; color: #383838; margin-left: auto; white-space: nowrap; }
  #frame { display: block; width: 100vw; height: calc(100vh - 44px); border: none; }
</style>
</head>
<body>

<div id="nav">
  <button id="btn-prev">&#9664;</button>
  <span id="ticker-label">—</span>
  <span id="count"></span>
  <button id="btn-next">&#9654;</button>
  <div class="sep"></div>
  <input id="search" type="text" placeholder="jump to ticker…" autocomplete="off" spellcheck="false">
  <span id="hint">[ &nbsp; ] &nbsp; cycle &nbsp;·&nbsp; / &nbsp; search &nbsp;·&nbsp; daily &nbsp;·&nbsp; conf 0</span>
</div>

<iframe id="frame" src="" frameborder="0" allowfullscreen></iframe>

<script>
(function() {
  const FILES  = ["AAPL_daily_ind0.html", "AAUC_daily_ind0.html", "AAV_daily_ind0.html", "ABX_daily_ind0.html", "ACB_daily_ind0.html", "AC_daily_ind0.html", "ADN_daily_ind0.html", "AEG_daily_ind0.html", "AEM_daily_ind0.html", "AFN_daily_ind0.html", "AGI_daily_ind0.html", "AG_daily_ind0.html", "AIDX_daily_ind0.html", "AIF_daily_ind0.html", "AII_daily_ind0.html", "AIM_daily_ind0.html", "AI_daily_ind0.html", "ALA_daily_ind0.html", "ALC_daily_ind0.html", "ALS_daily_ind0.html", "AMC_daily_ind0.html", "AMD_daily_ind0.html", "AMZN_daily_ind0.html", "APM_daily_ind0.html", "AQN_daily_ind0.html", "ARA_daily_ind0.html", "ARE_daily_ind0.html", "ARG_daily_ind0.html", "ARIS_daily_ind0.html", "ARX_daily_ind0.html", "ASM_daily_ind0.html", "ASND_daily_ind0.html", "ASTL_daily_ind0.html", "ATD_daily_ind0.html", "ATH_daily_ind0.html", "ATRL_daily_ind0.html", "ATS_daily_ind0.html", "ATZ_daily_ind0.html", "AUMN_daily_ind0.html", "AVL_daily_ind0.html", "AVNT_daily_ind0.html", "AW_daily_ind0.html", "AYA_daily_ind0.html", "BAM_daily_ind0.html", "BBUC_daily_ind0.html", "BB_daily_ind0.html", "BCE_daily_ind0.html", "BCHT_daily_ind0.html", "BDGI_daily_ind0.html", "BDT_daily_ind0.html", "BEPC_daily_ind0.html", "BHC_daily_ind0.html", "BIPC_daily_ind0.html", "BIR_daily_ind0.html", "BITF_daily_ind0.html", "BKI_daily_ind0.html", "BLCO_daily_ind0.html"];
  const LABELS = ["AAPL", "AAUC", "AAV", "ABX", "ACB", "AC", "ADN", "AEG", "AEM", "AFN", "AGI", "AG", "AIDX", "AIF", "AII", "AIM", "AI", "ALA", "ALC", "ALS", "AMC", "AMD", "AMZN", "APM", "AQN", "ARA", "ARE", "ARG", "ARIS", "ARX", "ASM", "ASND", "ASTL", "ATD", "ATH", "ATRL", "ATS", "ATZ", "AUMN", "AVL", "AVNT", "AW", "AYA", "BAM", "BBUC", "BB", "BCE", "BCHT", "BDGI", "BDT", "BEPC", "BHC", "BIPC", "BIR", "BITF", "BKI", "BLCO"];
  let idx = 0;

  function go(n) {
    idx = ((n % FILES.length) + FILES.length) % FILES.length;
    document.getElementById('frame').src = FILES[idx];
    document.getElementById('ticker-label').textContent = LABELS[idx];
    document.getElementById('count').textContent = (idx + 1) + ' / ' + FILES.length;
    document.getElementById('search').value = '';
  }

  document.getElementById('btn-prev').addEventListener('click', () => go(idx - 1));
  document.getElementById('btn-next').addEventListener('click', () => go(idx + 1));

  document.addEventListener('keydown', function(e) {
    if (document.activeElement === document.getElementById('search')) return;
    if (e.key === '[')  { e.preventDefault(); go(idx - 1); }
    if (e.key === ']')  { e.preventDefault(); go(idx + 1); }
    if (e.key === '/')  { e.preventDefault(); document.getElementById('search').focus(); }
  });

  const searchEl = document.getElementById('search');
  searchEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const q = this.value.trim().toUpperCase();
      const i = LABELS.findIndex(l => l === q);
      if (i >= 0) { go(i); this.blur(); }
      else { this.style.color = '#f66'; setTimeout(() => this.style.color = '', 600); }
    }
    if (e.key === 'Escape') { this.value = ''; this.blur(); }
  });

  // live filter: show first match as user types
  searchEl.addEventListener('input', function() {
    const q = this.value.trim().toUpperCase();
    if (!q) return;
    const i = LABELS.findIndex(l => l.startsWith(q));
    if (i >= 0) {
      document.getElementById('ticker-label').textContent = LABELS[i] + '…';
      document.getElementById('count').textContent = '';
    }
  });

  go(0);
})();
</script>
</body>
</html>
